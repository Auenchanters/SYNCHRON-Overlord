name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries (PyMuPDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (offline, no API key)
        env:
          OVERLORD_LIVE_LLM: "0"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zerotouch-ap-auditor:ci .
      - name: Smoke test container
        run: |
          docker run -d --name overlord -p 7860:7860 -e OVERLORD_LIVE_LLM=0 zerotouch-ap-auditor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs overlord; exit 1
